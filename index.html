<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; connect-src https://svzxcffujedwylakbbla.supabase.co; form-action 'none'; frame-ancestors 'none'; img-src https://svzxcffujedwylakbbla.supabase.co; script-src 'self'; style-src 'self'"
    />
    <title>Sua foto</title>
    <link rel="stylesheet" href="./share.css" />
    <script defer src="./share.js"></script>
  </head>
  <body>
    <main>
      <article class="card" aria-labelledby="title">
        <div class="image-wrap">
          <img id="photo" class="photo" alt="Foto do evento" hidden />
          <p id="loading" class="image-status" role="status">Carregando foto…</p>
        </div>
        <div class="copy">
          <p class="eyebrow">Sua foto está pronta</p>
          <h1 id="title">Guarde este momento</h1>
          <div class="actions">
            <a id="download" class="button primary" href="#" download="foto-evento.jpg" hidden>Baixar foto</a>
            <button id="share" class="button secondary" type="button" disabled hidden>Compartilhar</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p class="privacy">Este link temporário mostra somente esta foto. Evite encaminhá-lo se quiser manter o acesso privado.</p>
        </div>
      </article>
    </main>
  </body>
</html>
